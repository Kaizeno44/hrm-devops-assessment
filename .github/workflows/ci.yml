name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: hrm-app

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        working-directory: ./application
        run: npm install

      - name: Run tests
        working-directory: ./application
        run: npm test

      - name: Lint
        working-directory: ./application
        run: npm run lint --if-present

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./application
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 3000:3000 $IMAGE_NAME:latest
          sleep 10
          curl -f http://localhost:3000/health || exit 1
          docker stop test-app
          docker rm test-app

      - name: Build success
        if: success()
        run: echo "Build and tests passed"

      - name: Build failure
        if: failure()
        run: echo "Pipeline failed"